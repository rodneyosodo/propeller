name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/absmach/propeller

jobs:
  docker-go:
    name: Docker Go / ${{ matrix.svc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # riscv64 disabled for manager and proxy until wasmtime-go adds
          # riscv64 support: https://github.com/bytecodealliance/wasmtime-go/pull/285
          - { svc: manager, platforms: "linux/amd64,linux/arm64" }
          # cli: riscv64 also disabled — gcr.io/distroless/static-debian12 has no riscv64 image
          - { svc: cli,     platforms: "linux/amd64,linux/arm64" }
          - { svc: proxy,   platforms: "linux/amd64,linux/arm64" }

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          version=$(git describe --abbrev=0 --tags 2>/dev/null || echo 'v0.0.0')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "commit=$commit" >> $GITHUB_OUTPUT
          echo "time=$time" >> $GITHUB_OUTPUT
          tags="${{ env.IMAGE_PREFIX }}/${{ matrix.svc }}:latest"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version_tag="${{ env.IMAGE_PREFIX }}/${{ matrix.svc }}:${GITHUB_REF_NAME}"
          else
            version_tag="${{ env.IMAGE_PREFIX }}/${{ matrix.svc }}:$commit"
          fi
          printf 'tags<<EOF\n%s\n%s\nEOF\n' "$tags" "$version_tag" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            SVC=${{ matrix.svc }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            TIME=${{ steps.meta.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-proplet:
    name: Docker proplet
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          version=$(git describe --abbrev=0 --tags 2>/dev/null || echo 'v0.0.0')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "commit=$commit" >> $GITHUB_OUTPUT
          echo "time=$time" >> $GITHUB_OUTPUT
          tags="${{ env.IMAGE_PREFIX }}/proplet:latest"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version_tag="${{ env.IMAGE_PREFIX }}/proplet:${GITHUB_REF_NAME}"
          else
            version_tag="${{ env.IMAGE_PREFIX }}/proplet:$commit"
          fi
          printf 'tags<<EOF\n%s\n%s\nEOF\n' "$tags" "$version_tag" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.proplet
          # The builder stage uses FROM --platform=$BUILDPLATFORM so Rust
          # cross-compiles on the host (amd64) rather than running under QEMU.
          # wasmtime releases provide amd64 and arm64 Linux binaries.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            TIME=${{ steps.meta.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-proplet-wasinn:
    name: Docker proplet (wasi-nn)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          version=$(git describe --abbrev=0 --tags 2>/dev/null || echo 'v0.0.0')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "commit=$commit" >> $GITHUB_OUTPUT
          echo "time=$time" >> $GITHUB_OUTPUT
          tags="${{ env.IMAGE_PREFIX }}/proplet-wasi-nn:latest"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version_tag="${{ env.IMAGE_PREFIX }}/proplet-wasi-nn:${GITHUB_REF_NAME}"
          else
            version_tag="${{ env.IMAGE_PREFIX }}/proplet-wasi-nn:$commit"
          fi
          printf 'tags<<EOF\n%s\n%s\nEOF\n' "$tags" "$version_tag" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.proplet-wasinn
          # OpenVINO backend is x86-only
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            TIME=${{ steps.meta.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
