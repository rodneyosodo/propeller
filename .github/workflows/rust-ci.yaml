name: Rust Continuous Integration Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "proplet/**"
      - "examples/hal-test/**"
      - "examples/hal-runner/**"
      - "examples/attestation-test/**"
      - ".github/**"

  pull_request:
    branches:
      - main
    paths:
      - "proplet/**"
      - "examples/hal-test/**"
      - "examples/hal-runner/**"
      - "examples/attestation-test/**"
      - ".github/**"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

jobs:
  rust-lint-and-build:
    name: Rust Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./proplet

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The amd-sev feature pulls az-snp-vtpm -> tss-esapi-sys, whose build
      # script needs the TPM2 TSS headers (tss2-sys.pc) on the runner.
      - name: Install TPM2 TSS development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev libssl-dev pkg-config

      - name: Check cargo
        run: cargo check --release

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: cargo clippy -- -D warnings

      - name: Check HAL WIT dep copies are identical
        working-directory: .
        run: |
          diff -r proplet/wit/hal/deps examples/hal-test/wit/deps
          diff -r proplet/wit/hal/deps examples/hal-runner/wit/deps
          diff -r proplet/wit/hal/deps examples/attestation-test/wit/deps

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release
