name: Build

on:
  push:
    branches:
      - main

    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}/${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, service: manager }
          - { goos: linux, goarch: arm64, service: manager }
          - { goos: linux, goarch: amd64, service: cli }
          - { goos: linux, goarch: arm64, service: cli }
          - { goos: linux, goarch: riscv64, service: cli }
          - { goos: linux, goarch: amd64, service: proxy }
          - { goos: linux, goarch: arm64, service: proxy }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
          cache-dependency-path: go.sum

      - name: Build
        run: |
          mkdir -p dist
          make ${{ matrix.service }} GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0
          mv build/${{ matrix.service }} dist/${{ matrix.service }}-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  proplet:
    name: proplet-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation toolchains
        if: matrix.goarch != 'amd64'
        run: |
          sudo apt-get update
          case "${{ matrix.goarch }}" in
            arm64) sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross ;;
            riscv64) sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross ;;
          esac

      - name: Build
        run: |
          mkdir -p dist
          case "${{ matrix.goarch }}" in
            amd64) target="x86_64-unknown-linux-gnu" ;;
            arm64) target="aarch64-unknown-linux-gnu" ;;
            riscv64) target="riscv64gc-unknown-linux-gnu" ;;
          esac
          rustup target add "$target"
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          elif [ "${{ matrix.goarch }}" = "riscv64" ]; then
            export CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc
          fi
          cd proplet && cargo build --release --target "$target"
          mv target/$target/release/proplet ../dist/proplet-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proplet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  release:
    name: GitHub Release
    needs: [build, proplet]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
          body: |
            ## Docker Images

            Multi-architecture Docker images (linux/amd64, linux/arm64) are available on GHCR:

            ```
            docker pull ghcr.io/absmach/propeller/manager:${{ github.ref_name }}
            docker pull ghcr.io/absmach/propeller/cli:${{ github.ref_name }}
            docker pull ghcr.io/absmach/propeller/proxy:${{ github.ref_name }}
            docker pull ghcr.io/absmach/propeller/proplet:${{ github.ref_name }}
            docker pull ghcr.io/absmach/propeller/proplet-wasi-nn:${{ github.ref_name }}
            ```

            Images are tagged with the release version (e.g., `${{ github.ref_name }}`) and `:latest` is updated to point to the most recent stable release. The `proplet-wasi-nn` image (wasi-nn/OpenVINO support) is linux/amd64 only.

            ## Quick Start

            Follow the [getting started guide](https://www.absmach.eu/docs/propeller/getting-started/) for the full walkthrough, or the steps below (requires Go, Rust, Docker and Make).

            1. Clone the repository at the release tag and build the binaries:

            ```bash
            git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/absmach/propeller.git
            cd propeller
            make all -j $(nproc)
            make install
            ```

            2. Start the base services (Atom, FluxMQ, Nginx). TLS certificates are generated automatically:

            ```bash
            make start-base
            ```

            3. Provision the Propeller resources in Atom — creates the tenant, manager/proplet/proxy service accounts, channel and writes `config.toml`:

            ```bash
            propeller-cli provision
            ```

            4. Copy the generated config into the Docker directory, pin the release images in `docker/.env` (set `PROP_RELEASE_TAG` and `PROPLET_IMAGE_TAG` to `${{ github.ref_name }}`), and start Propeller:

            ```bash
            cp config.toml docker/config.toml
            make start-propeller
            ```

            5. Verify the deployment:

            ```bash
            curl http://localhost:7070/health
            curl http://localhost:7070/proplets
            ```

            ## Running the Binaries Directly

            Download the binaries for your architecture, make them executable, and run:

            ```bash
            chmod +x manager-linux-<arch>
            ./manager-linux-<arch>
            ```

            Available binaries: `manager` (amd64, arm64), `cli` (amd64, arm64, riscv64), `proxy` (amd64, arm64) and `proplet` (amd64, arm64, riscv64).

            For full documentation, visit the [README](https://github.com/absmach/propeller).
