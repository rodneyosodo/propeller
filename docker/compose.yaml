name: "propeller-base"

networks:
  propeller-base-net:
    driver: bridge
    name: propeller-base-net
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  propeller-atom-db-volume:
  propeller-fluxmq-node1-volume:

services:
  atom-db:
    image: docker.io/postgres:18.0-alpine3.22
    container_name: propeller-atom-db
    restart: on-failure
    environment:
      POSTGRES_USER: ${ATOM_DB_USER}
      POSTGRES_PASSWORD: ${ATOM_DB_PASS}
      POSTGRES_DB: ${ATOM_DB_NAME}
    networks:
      - propeller-base-net
    volumes:
      - propeller-atom-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 60

  atom:
    image: ghcr.io/absmach/atom:${ATOM_IMAGE_TAG}
    pull_policy: always
    container_name: propeller-atom
    restart: on-failure
    depends_on:
      atom-db:
        condition: service_healthy
    ports:
      - "${ATOM_HTTP_PORT}:${ATOM_HTTP_PORT}"
      - "${ATOM_GRPC_PORT}:${ATOM_GRPC_PORT}"
    volumes:
      - ./atom/atom-bootstrap.yaml:/etc/atom/atom-bootstrap.yaml:ro
      # gRPC mTLS material for the broker auth callout: Atom's gRPC listener
      # server certificate and the CA that signs FluxMQ's client certificate.
      - ./ssl/certs:/certs:ro
    environment:
      DATABASE_URL: "postgres://${ATOM_DB_USER}:${ATOM_DB_PASS}@atom-db:5432/${ATOM_DB_NAME}"
      LISTEN_ADDR: "0.0.0.0:${ATOM_HTTP_PORT}"
      GRPC_ADDR: "0.0.0.0:${ATOM_GRPC_PORT}"
      ATOM_LOG_LEVEL: ${ATOM_LOG_LEVEL}
      ATOM_LOG_FORMAT: ${ATOM_LOG_FORMAT}
      ATOM_PUBLIC_BASE_URL: ${ATOM_PUBLIC_BASE_URL}
      ATOM_CORS_ALLOWED_ORIGINS: ${ATOM_CORS_ALLOWED_ORIGINS}
      ADMIN_SECRET: ${ATOM_ADMIN_SECRET}
      ADMIN_ENTITY_ID: ${ATOM_ADMIN_ENTITY_ID}
      ATOM_SELF_REGISTRATION_ENABLED: ${ATOM_SELF_REGISTRATION_ENABLED}
      ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN: ${ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN}
      ATOM_METRICS_ENABLED: ${ATOM_METRICS_ENABLED}
      ATOM_KEY_ENCRYPTION_KEY: ${ATOM_KEY_ENCRYPTION_KEY}
      ATOM_KEY_ENCRYPTION_KEY_ID: ${ATOM_KEY_ENCRYPTION_KEY_ID:-local:v1}
      ATOM_MIN_PASSWORD_CHARS: ${ATOM_MIN_PASSWORD_CHARS:-8}
      ATOM_JWT_AUDIENCE: ${ATOM_JWT_AUDIENCE}
      JWT_EXPIRY_SECS: ${ATOM_JWT_EXPIRY_SECS}
      ATOM_LOGIN_FAILURE_LIMIT: ${ATOM_LOGIN_FAILURE_LIMIT:-1000}
      ATOM_LOGIN_FAILURE_WINDOW_SECS: ${ATOM_LOGIN_FAILURE_WINDOW_SECS:-30}
      ATOM_BOOTSTRAP_FILE: ${ATOM_BOOTSTRAP_FILE:-/etc/atom/atom-bootstrap.yaml}
      # Native FluxMQ broker auth callout: Atom implements FluxMQ's AuthService
      # over gRPC, so FluxMQ authenticates/authorizes directly against Atom with
      # no adapter service in between. Requires gRPC mutual TLS.
      ATOM_BROKER_AUTH_ENABLED: ${ATOM_BROKER_AUTH_ENABLED:-true}
      ATOM_BROKER_TOPIC_TEMPLATE: ${ATOM_BROKER_TOPIC_TEMPLATE:-m/{tenant}/c/{resource}/{subtopic}}
      ATOM_BROKER_TOPIC_REF: ${ATOM_BROKER_TOPIC_REF:-uuid}
      ATOM_BROKER_CREDENTIAL_KIND: ${ATOM_BROKER_CREDENTIAL_KIND:-shared_key}
      ATOM_GRPC_TLS_CERT_PATH: ${ATOM_GRPC_TLS_CERT_PATH:-/certs/atom-grpc-server.crt}
      ATOM_GRPC_TLS_KEY_PATH: ${ATOM_GRPC_TLS_KEY_PATH:-/certs/atom-grpc-server.key}
      ATOM_GRPC_TLS_CLIENT_CA_PATH: ${ATOM_GRPC_TLS_CLIENT_CA_PATH:-/certs/ca.crt}
    networks:
      - propeller-base-net

  atom-ui:
    image: ghcr.io/absmach/atom-ui:${ATOM_UI_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: propeller-atom-ui
    restart: on-failure
    depends_on:
      - atom
    environment:
      ATOM_GRAPHQL_URL: http://atom:${ATOM_HTTP_PORT:-8080}/graphql
    ports:
      - ${ATOM_UI_HTTP_PORT:-3005}:3000
    networks:
      - propeller-base-net

  fluxmq-node1:
    image: ghcr.io/absmach/fluxmq:${FLUXMQ_IMAGE_TAG}
    pull_policy: always
    container_name: propeller-fluxmq-node1
    user: "0:0"
    command: ["-config", "/etc/fluxmq/config.yaml"]
    depends_on:
      atom:
        condition: service_started
    restart: on-failure
    ports:
      - "${MG_COAP_PORT}:5683/udp"
      - "${MG_FLUXMQ_API_PORT}:8082"
    networks:
      propeller-base-net:
        ipv4_address: 172.30.0.201
    volumes:
      - ./fluxmq/node1.yaml:/etc/fluxmq/config.yaml:ro
      # Client certificate and CA for the gRPC auth callout to Atom's broker
      # auth service (mutual TLS).
      - ./ssl/certs/fluxmq-atom-client.crt:/etc/fluxmq/certs/fluxmq-atom-client.crt:ro
      - ./ssl/certs/fluxmq-atom-client.key:/etc/fluxmq/certs/fluxmq-atom-client.key:ro
      - ./ssl/certs/ca.crt:/etc/fluxmq/certs/ca.crt:ro
      - propeller-fluxmq-node1-volume:/tmp/fluxmq

  nginx:
    image: docker.io/nginx:1.31.5-alpine3.24
    container_name: propeller-nginx
    restart: on-failure
    volumes:
      - ./nginx/nginx-key.conf:/etc/nginx/nginx.conf.template
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/entrypoint.sh
      - ./nginx/snippets:/etc/nginx/snippets
      - ./ssl/authorization.js:/etc/nginx/authorization.js
      - type: bind
        source: ${MG_NGINX_SERVER_CERT:-./ssl/certs/propeller-server.crt}
        target: /etc/ssl/certs/propeller-server.crt
      - type: bind
        source: ${MG_NGINX_SERVER_KEY:-./ssl/certs/propeller-server.key}
        target: /etc/ssl/private/propeller-server.key
      - type: bind
        source: ${MG_NGINX_SERVER_CLIENT_CA:-./ssl/certs/ca.crt}
        target: /etc/ssl/certs/ca.crt
      - type: bind
        source: ${MG_NGINX_SERVER_DHPARAM:-./ssl/dhparam.pem}
        target: /etc/ssl/certs/dhparam.pem
    ports:
      - ${MG_NGINX_HTTP_PORT}:${MG_NGINX_HTTP_PORT}
      - ${MG_NGINX_SSL_PORT}:${MG_NGINX_SSL_PORT}
      - ${MG_NGINX_MQTT_PORT}:${MG_NGINX_MQTT_PORT}
      - ${MG_NGINX_MQTT_V5_PORT}:${MG_NGINX_MQTT_V5_PORT}
      - ${MG_NGINX_MQTTS_PORT}:${MG_NGINX_MQTTS_PORT}
      - ${MG_NGINX_AMQP_PORT}:${MG_NGINX_AMQP_PORT}
    networks:
      - propeller-base-net
    env_file:
      - .env
    depends_on:
      - fluxmq-node1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.76.0
    container_name: propeller-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: ${MG_JAEGER_COLLECTOR_OTLP_ENABLED}
    command: --memory.max-traces ${MG_JAEGER_MEMORY_MAX_TRACES}
    ports:
      - ${MG_JAEGER_FRONTEND}:${MG_JAEGER_FRONTEND}
      - ${MG_JAEGER_OLTP_HTTP}:${MG_JAEGER_OLTP_HTTP}
    networks:
      - propeller-base-net
