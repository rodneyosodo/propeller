server:
  mqtt:
    tcp:
      v3:
        addr: "0.0.0.0:1883"
        protocol: "v3"
        max_connections: 10000
        read_timeout: 60s
        write_timeout: 60s
      v5:
        addr: "0.0.0.0:1884"
        protocol: "v5"
        max_connections: 10000
        read_timeout: 60s
        write_timeout: 60s
    websocket:
      v3:
        addr: "0.0.0.0:8883"
        path: "/mqtt"
        protocol: "v3"
      v5:
        addr: "0.0.0.0:8884"
        path: "/mqtt"
        protocol: "v5"
  http:
    plain:
      addr: "0.0.0.0:8090"
  coap:
    plain:
      addr: "0.0.0.0:5683"
  amqp:
    plain:
      addr: "0.0.0.0:5672"
      max_connections: 10000
  amqp091:
    plain:
      addr: "0.0.0.0:5682"
  health_addr: "0.0.0.0:8081"
  health_enabled: true
  shutdown_timeout: 30s

broker:
  max_message_size: 1048576
  max_retained_messages: 10000
  retry_interval: 20s
  max_retries: 0
  max_qos: 2
  async_fan_out: false
  fan_out_workers: 0

session:
  max_sessions: 10000
  default_expiry_interval: 300
  max_offline_queue_size: 10000
  max_inflight_messages: 1000
  max_send_queue_size: 1000
  offline_queue_policy: "evict"
  inflight_overflow: 1
  pending_queue_size: 1000

log:
  level: "info"
  format: "text"

storage:
  type: "badger"
  badger_dir: "/tmp/fluxmq/data"
  badger_sync_writes: false

cluster:
  enabled: false

queue_manager:
  auto_commit_interval: 5s

queues:
  - name: "mqtt"
    topics:
      - "$queue/#"
    reserved: true
  - name: "events"
    topics:
      - "$queue/events/#"
    type: "stream"
    retention:
      max_age: 168h
      max_length_bytes: 1073741824
  - name: "writers"
    topics:
      - "$queue/writers/#"
    type: "stream"
    retention:
      max_age: 24h
      max_length_bytes: 1073741824
  - name: "alarms"
    topics:
      - "$queue/alarms/#"
    type: "stream"
    retention:
      max_age: 24h
      max_length_bytes: 1073741824

auth:
  # FluxMQ delegates connect-time authentication and per-topic authorization to
  # Atom's native broker auth callout (`/broker.auth.v1.AuthService`), so no
  # adapter service sits between the broker and Atom. The callout runs over
  # Atom's gRPC listener with mutual TLS: FluxMQ presents a client certificate
  # signed by the deployment CA, which Atom requires as its gRPC client CA when
  # broker auth is enabled (see ATOM_GRPC_TLS_CLIENT_CA_PATH in compose.yaml).
  external:
    url: "https://atom:8081"
    transport: "grpc"
    timeout: 15s
    tls:
      cert_file: "/etc/fluxmq/certs/fluxmq-atom-client.crt"
      key_file: "/etc/fluxmq/certs/fluxmq-atom-client.key"
      ca_file: "/etc/fluxmq/certs/ca.crt"
    protocols:
      mqtt: true
      http: true
      coap: true
      amqp: true
      amqp091: false
