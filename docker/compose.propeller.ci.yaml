#
# CI overlay for the integration test.
#
# compose.propeller.yaml pins the published ghcr.io images with
# `pull_policy: always`, so on its own it exercises the last release rather
# than the commit under test. This overlay repoints the three services at
# images built from the working tree (see `make ci-images`) and turns the
# pull off.
#
# It also disables the container healthchecks. Those probe the service with
# `wget`, which the distroless-based images do not ship, so they can never
# pass; the integration test polls the published ports from the host instead.
#
# Usage:
#   docker compose -f docker/compose.propeller.yaml \
#                  -f docker/compose.propeller.ci.yaml \
#                  --env-file docker/.env up -d

name: "propeller"

services:
  manager:
    image: propeller-ci/manager:latest
    pull_policy: never
    healthcheck:
      disable: true

  proplet:
    image: propeller-ci/proplet:latest
    pull_policy: never
    healthcheck:
      disable: true

  proxy:
    image: propeller-ci/proxy:latest
    pull_policy: never
    healthcheck:
      disable: true
